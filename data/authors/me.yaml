bio: >
  I am a fourth-year PhD researcher at Cardiff University, working under the
  supervision of Dr You Zhou and Dr Xianfang Sun. My primary research interest
  lies in AI for Science - leveraging machine learning to solve complex medical
  and biological challenges. My current work spans two main areas: developing
  diagnostic tools for fatty liver disease using ultrasound and clinical data,
  and advancing AI methods for single-cell and spatial transcriptomics.

